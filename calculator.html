<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Page</title>
</head>
<style>
*{
    padding: 0;
    margin: 0;
    font-family: 'poppins', sans-serif;
    box-sizing: border-box;
}

.container{
    width: 100%;
    height: 100vh;
    background: #e3f9ff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: 330px;
}

.calculator{
    background: #3a4452;
    padding: 20px;
    border-radius: 10px;
}

.calculator form input{
    width: 60px;
    height: 60px;
    border: 0;
    outline: 0;
    box-shadow: -8px -8px 15px rgba(255, 255, 255, 0.1 ), 5px 5px 15px rgba(0, 0, 0, 0.2 );
    background: transparent;
    font-size: 20px;
    color: #fff;
    cursor: pointer;
}

form .display{
   display: flex;
   justify-content: flex-end;
   margin: 20px 0;
}

form .display input{
    text-align: right;
    flex: 1;
    font-size: 45px;
    box-shadow: none;
}

form input.equalto{
    width: 145px;
}

.secondcalc{
    float: left;
    margin-left: 420px;
    margin-top: -340px;
    font-family: sans-serif;
      background-color: rgba(25, 35, 45, 0.5 );
}

.secondcalc input{
    font-size: 16px;
    border: none;
   background: transparent;
   background-color: #3a4452;
   color: #fff;
}

#calc, p{
    color: #fff;
    font-size: 25px;
}

#answer{
    width: 130px;
    background: transparent;
    background-color: #3a4452;
    color: #fff;
}

.btn{
    background-color: orangered;
    color: #fff;
    cursor: pointer;
    border-radius: 10px;
}

.btn:hover{
  background-color: blue;
}

</style>
<body>
   <div class="container">
    <div class="calculator">
        
        <form action="">
          <div class="display">
             <input type="text" name="display">
          </div> 
            <div>
                <input type="button" value="AC" onclick="display.value ='' ">
                <input type="button" value="DE" onclick="display.value = display.value.toString().slice( 0, -1)">
                <input type="button" value="." onclick="display.value +='.' ">
                <input type="button" value="/" onclick="display.value +='/' ">
            </div>
            
            <div>
                <input type="button" value="7" onclick="display.value +='7' ">
                <input type="button" value="8" onclick="display.value +='8' ">
                <input type="button" value="9" onclick="display.value +='9' ">
                <input type="button" value="*" onclick="display.value +='*' ">
            </div>
            
            <div>
                <input type="button" value="4" onclick="display.value +='4' ">
                <input type="button" value="5" onclick="display.value +='5' ">
                <input type="button" value="6" onclick="display.value +='6' ">
                <input type="button" value="-" onclick="display.value +='-' ">
            </div>
            
            <div>
                <input type="button" value="1" onclick="display.value +='1' ">
                <input type="button" value="2" onclick="display.value +='2' ">
                <input type="button" value="3" onclick="display.value +='3' ">
                <input type="button" value="+" onclick="display.value +='+' ">
            </div>
            
            <div>
                <input type="button" value="00" onclick="display.value +='00' ">
                <input type="button" value="0" onclick="display.value +='0' ">
                <input type="button" value="=" onclick = "display.value = eval(display.value)" class="equalto" >
                
            </div>
            </div>

                        
        </form>
        
            
            <div class="secondcalc">
             <span id="calc">Calculate the Area :</span>
             <br><br>
            <p>Width:</p>  <br>
             <input type="number" id="width"> 
              
             <br><br>
             <p>Heighth:</p>   <br>
             <input type="number" id="height">
               <br><br>
             <input type="button" class="btn"
            onclick="calc()" value="calculate">
             <input type="text" id="answer">
             <br><br>
             
    </div>
   </div>
   <script lang="javaScript" type="text/javaScript" src="calculator.js">

   </script>
</body>
</html>
